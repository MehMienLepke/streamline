<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="streamline-app" content="1.1.0">
<!-- Privacy-slot: deze pagina mag alleen GitHub lezen (updates/widgets). Elk ander verzoek om gegevens te versturen wordt door de browser geblokkeerd. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src * data: blob:; media-src *; connect-src https://raw.githubusercontent.com; font-src data:; form-action 'none'; base-uri 'none'">
<title>Streamline</title>
<style>
:root{
  --bg:#ECEBE7;--surface:#FFFFFF;--surface-2:#F5F4F0;--ink:#171816;--muted:#73766F;--line:#E3E1DB;
  --accent:#2E5E4E;--accent-ink:#FFFFFF;--accent-soft:#E3ECE7;
  --hi:#D64533;--mid:#E8892B;--lo:#E2B93B;
  --r:22px;--r-sm:13px;--r-xs:9px;
  --shadow:0 1px 2px rgba(20,22,20,.04),0 8px 24px -12px rgba(20,22,20,.10);
  --shadow-lg:0 24px 60px -20px rgba(15,17,15,.35),0 2px 6px rgba(15,17,15,.06);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:Bahnschrift,"Segoe UI Variable Display","DIN Alternate","Segoe UI",system-ui,sans-serif;
  --title-font:var(--font-display);--title-color:var(--ink);--title-weight:600;
  --cw:40px;--rh:36px;--gap:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{display:block;flex:none}
::selection{background:var(--accent-soft)}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:16px;padding:18px 32px 12px;position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:22px;height:22px;color:var(--accent);flex:none}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.02em;line-height:1}
.brand-sub{font-family:var(--font-display);font-size:15px;line-height:1;color:var(--muted);font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub:before{content:"/";margin:0 7px 0 1px;opacity:.45}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s,background .15s}
.round:hover{transform:translateY(-1px)}
.round.on{background:var(--ink);color:var(--bg)}
.pill{height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--surface);display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-weight:600;font-size:13px}
.pill.accent{background:var(--accent);color:var(--accent-ink)}
.pill.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.pill.update{background:var(--accent);color:var(--accent-ink);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.0;transition:opacity .4s}
.save-dot.busy{opacity:.9}

#banner{margin:0 32px 8px;padding:12px 16px;border-radius:var(--r-sm);background:var(--accent-soft);display:none;align-items:center;gap:12px;font-size:13px}
#banner.show{display:flex}
#banner button{margin-left:auto}

/* ---------- canvas & grid ---------- */
#canvas{position:relative;margin:6px 32px 48px;min-height:calc(100vh - 140px)}
body.editing #canvas{background-image:var(--gridimg);background-repeat:repeat;border-radius:var(--r-sm)}
/* Lagen: een onderdeel maakt zelf geen eigen laag, zodat de greep en knoppen van een vak
   altijd bóven alle widgets liggen, terwijl het vak zelf altijd onderop ligt. */
.item{position:absolute;transition:left .14s ease,top .14s ease,width .14s ease,height .14s ease,box-shadow .2s}
.item>.card{z-index:3}
.item.t-title>.card{z-index:2}
.item.t-box>.card{z-index:1}
.item.dragging{transition:none;cursor:grabbing}
.item.dragging:not(.t-box)>.card,.item.resizing:not(.t-box)>.card{z-index:30}
.item.dragging .card{box-shadow:var(--shadow-lg)}
.card{width:100%;height:100%;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column}
.card.flat{background:transparent;box-shadow:none;border-radius:0;overflow:visible}
.card-head{display:flex;align-items:center;gap:8px;padding:16px 20px 6px;font-weight:650;font-size:15px}
.card-head .sub{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.card-body{flex:1;min-height:0;padding:6px 20px 18px;display:flex;flex-direction:column}

/* edit chrome */
.chrome{display:none}
body.editing .chrome{display:block}
.shield{position:absolute;inset:0;z-index:4;cursor:grab;border-radius:var(--r)}
body.editing .item:not(.locked) .card{outline:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}
body.editing .item.locked .card{outline:1.5px solid color-mix(in srgb,var(--muted) 40%,transparent);outline-offset:3px}
.item.locked .shield{cursor:not-allowed}
.grip{position:absolute;top:-11px;left:50%;transform:translateX(-50%);height:22px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--bg);display:flex;align-items:center;cursor:grab;box-shadow:var(--shadow);z-index:40}
.grip span{display:block;width:26px;height:4px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;opacity:.85;height:7px}
.item.locked .grip{background:var(--muted);cursor:not-allowed}
.tools{position:absolute;top:8px;right:8px;z-index:41;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.item:hover .tools,.item.locked .tools{opacity:1}
.item.t-box .shield{z-index:1}
.item.dragging:not(.t-box) .shield{z-index:31}
.boxpad{position:absolute;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:calc(var(--r-sm) * .6);pointer-events:none;display:none}
body.editing .boxpad{display:block}
.tools button{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.tools button:hover{background:var(--accent);color:var(--accent-ink)}
.tools button.lock-on{background:var(--ink);color:var(--bg)}
.item.locked .tools .nl{display:none}
.resize{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;z-index:40;cursor:nwse-resize;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:var(--shadow)}
.item.locked .resize{display:none}
.size-badge{position:absolute;left:10px;bottom:10px;z-index:42;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--bg);opacity:0;transition:opacity .15s}
.item.dragging .size-badge,.item.resizing .size-badge{opacity:1}
.item.resizing{transition:none}

/* ---------- floating panels ---------- */
.panel{position:fixed;z-index:60;width:380px;max-height:min(78vh,760px);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.panel.show{display:flex}
.panel-grip{height:26px;display:flex;justify-content:center;align-items:center;cursor:grab;flex:none}
.panel-grip span{width:44px;height:5px;border-radius:999px;background:var(--line)}
.panel-grip:hover span{background:var(--muted)}
.panel-head{display:flex;align-items:center;gap:10px;padding:0 20px 12px}
.panel-head h3{margin:0;font:600 19px var(--font-display)}
.panel-head .x{margin-left:auto}
.panel-body{overflow:auto;padding:0 20px 20px;flex:1}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}
.iconbtn:hover{background:var(--accent-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 20px 12px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.repo-group{margin:4px 0 16px}
.repo-group h4,.sect h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.repo-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;background:var(--surface-2);margin-bottom:6px;width:100%;text-align:left}
.repo-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.repo-item .ri{width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.repo-item b{display:block;font-size:13.5px}
.repo-item small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.repo-item .add{margin-left:auto;color:var(--muted)}

/* ---------- forms ---------- */
.sect{margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.lbl{font-size:12px;font-weight:650;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-xs);padding:9px 11px;outline:none;transition:border .15s}
.inp:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:42px;height:34px;border:1px solid var(--line);border-radius:var(--r-xs);padding:2px;background:var(--surface-2);cursor:pointer}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:650;font-size:13px;background:var(--surface-2);display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--hi)}
.btn.sm{padding:6px 11px;font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:4px 0 10px}
.list-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-xs);background:var(--surface-2);margin-bottom:6px}
.list-row.on{outline:2px solid var(--accent)}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* theme swatches */
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatch{border:2px solid transparent;border-radius:var(--r-sm);padding:8px;background:var(--surface-2);cursor:pointer;text-align:left}
.swatch.on{border-color:var(--accent)}
.swatch .sw{height:42px;border-radius:9px;display:flex;align-items:flex-end;padding:6px;gap:4px}
.swatch .sw i{width:12px;height:12px;border-radius:50%;display:block}
.swatch b{display:block;font-size:12px;margin-top:6px}

/* ---------- modals ---------- */
.mroot{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(10,12,10,.38);backdrop-filter:blur(3px);padding:20px}
.mroot.show{display:grid}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;align-items:center;padding:20px 22px 8px;gap:10px}
.modal-head h3{margin:0;font:600 20px var(--font-display)}
.modal-head .iconbtn{margin-left:auto}
.modal-body{padding:8px 22px 18px;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto}

.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:360px;overflow:auto;padding:2px}
.icongrid button{border:1px solid transparent;background:var(--surface-2);border-radius:var(--r-xs);padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.icongrid button:hover,.icongrid button.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

/* ---------- toasts & alarm ---------- */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .25s ease;max-width:80vw}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.alarm{position:fixed;right:24px;bottom:24px;z-index:210;width:340px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:18px 20px;border-left:6px solid var(--accent);animation:shake .6s ease 2}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.alarm h4{margin:0 0 4px;font:600 17px var(--font-display);display:flex;gap:8px;align-items:center;color:var(--accent)}
.alarm p{margin:0 0 14px;font-size:14px}
.alarm .row{flex-wrap:wrap}

/* popover */
.pop{position:fixed;z-index:150;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:8px;min-width:200px}
.pop button.opt{display:flex;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;gap:8px;align-items:center;font-size:13px}
.pop button.opt:hover{background:var(--accent-soft)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---------- widgets ---------- */
/* nav */
.nav{display:flex;gap:6px;align-items:center;height:100%;padding:6px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);overflow:auto;scrollbar-width:none}
.nav.v{flex-direction:column;border-radius:var(--r);padding:8px;align-items:stretch}
.nav button{border:0;background:transparent;border-radius:999px;height:40px;min-width:40px;padding:0 14px;display:flex;align-items:center;gap:8px;justify-content:center;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.nav.icons button{padding:0;width:44px;height:44px}
.nav.v button{justify-content:flex-start}
.nav.v.icons button{justify-content:center;align-self:center}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav button.addpage{border:1.5px dashed var(--line)}

/* link button */
.lb{width:100%;height:100%;border:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center;transition:transform .15s,box-shadow .15s;color:var(--ink);text-decoration:none;overflow:hidden}
.lb:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.lb.row-layout{flex-direction:row;justify-content:flex-start;padding:10px 18px;gap:14px;text-align:left}
.lb .lbi{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.lb .lbi img{width:26px;height:26px;border-radius:5px}
.lb .lbt{font-weight:650;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lb .lbs{font-size:11.5px;color:var(--muted);font-weight:500}
.lb.accent{background:var(--accent);color:var(--accent-ink)}
.lb.accent .lbi{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:var(--accent-ink)}
.lb.accent .lbs{color:color-mix(in srgb,var(--accent-ink) 70%,transparent)}
.lb.dark{background:var(--ink);color:var(--bg)}
.lb.dark .lbi{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.lb.outline{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.lb .run{position:absolute;right:12px;top:12px;font-size:10px;font-weight:700;opacity:.6;display:flex;gap:4px;align-items:center}

/* title */
.ttl{width:100%;height:100%;display:flex;align-items:flex-end;padding:0 4px 4px;font-family:var(--title-font);color:var(--title-color);font-weight:var(--title-weight);line-height:1.1;overflow:hidden}
.ttl.center{justify-content:center;text-align:center}.ttl.right{justify-content:flex-end;text-align:right}
.ttl.mid{align-items:center}

/* box */
.boxv{position:absolute;inset:0}
.boxmask{position:absolute;inset:0;background:var(--bg);display:none}
body.editing .boxmask{display:block}

/* todo */
.todo-add{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.todo-add .inp{border-radius:999px;padding:8px 14px}
.prio{display:flex;gap:3px;padding:3px;background:var(--surface-2);border-radius:999px}
.prio button{width:24px;height:24px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.prio button i{width:11px;height:11px;border-radius:50%;display:block}
.prio button.on{background:var(--surface);box-shadow:var(--shadow)}
.pc-hoog{background:var(--hi)}.pc-medium{background:var(--mid)}.pc-laag{background:var(--lo)}
.todo-list{flex:1;overflow:auto;margin:0 -6px;padding:0 6px}
.todo{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 0;border-radius:var(--r-xs);position:relative;background:var(--surface-2);margin-bottom:6px;overflow:hidden}
.todo .bar{width:5px;align-self:stretch;flex:none}
.todo .cb{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.todo.done .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.todo .tt{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere;outline:none}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo.done{opacity:.65}
.todo .meta{font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap}
.todo .ta{opacity:0;display:flex;gap:2px;transition:opacity .15s}
.todo:hover .ta,.todo .ta.has{opacity:1}
.mini{width:26px;height:26px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);padding:0}
.mini:hover{background:var(--surface);color:var(--ink)}
.mini.on{color:var(--accent)}
.dropping{outline:2.5px dashed var(--accent)!important;outline-offset:-6px;background:var(--accent-soft)!important}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 8px}
.todo-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);padding-top:6px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:2px}
.linkbtn:hover{color:var(--ink)}

/* notes */
.notes{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:0 -6px;padding:0 6px 4px}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:4px 4px 6px;position:relative;border:1.5px solid transparent;transition:border .15s}
.note:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--surface)}
.note.due{border-color:var(--accent)}
.nt{display:none;gap:1px;padding:3px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:4px}
.note:focus-within .nt{display:flex}
.nt button{width:28px;height:28px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.nt button:hover{background:var(--accent-soft);color:var(--ink)}
.ne{outline:none;padding:6px 10px;min-height:38px;font-size:13.5px;overflow-wrap:anywhere}
.ne:empty:before{content:attr(data-ph);color:var(--muted)}
.ne h3{font:600 16px var(--font-display);margin:4px 0}
.ne ul,.ne ol{margin:4px 0;padding-left:22px}
.ne ul.chk{list-style:none;padding-left:4px}
.ne ul.chk li{padding-left:24px;position:relative;cursor:pointer}
.ne ul.chk li:before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border:2px solid var(--muted);border-radius:4px}
.ne ul.chk li.ok{text-decoration:line-through;color:var(--muted)}
.ne ul.chk li.ok:before{background:var(--accent);border-color:var(--accent)}
.ne mark{background:color-mix(in srgb,var(--lo) 55%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.ne a{color:var(--accent)}
.nf{display:flex;align-items:center;gap:4px;padding:0 6px}
.nf .when{font-size:11px;color:var(--muted);margin-right:auto}
.nf .rem{font-size:11px;font-weight:700;color:var(--accent);display:flex;gap:4px;align-items:center}

/* radio */
.radio{display:flex;flex-direction:column;height:100%;gap:10px}
.radio-now{display:flex;align-items:center;gap:14px;flex:1;min-height:0}
.radio-play{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.radio-play:hover{filter:brightness(1.08)}
.radio-meta{min-width:0;flex:1}
.radio-meta b{display:block;font:600 18px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio-meta small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.radio-ctrl{display:flex;gap:8px;align-items:center}

/* cropper */
.cr{display:flex;flex-direction:column;height:100%;gap:10px;min-height:0}
.cr-drop{flex:1;border:2px dashed var(--line);border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:16px;cursor:pointer;transition:all .15s}
.cr-drop:hover{border-color:var(--accent);color:var(--ink)}
.cr-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cr-bar .inp{width:auto;padding:6px 10px}
.cr-main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cr-main.stack{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.cr-pane{background:var(--surface-2);border-radius:var(--r-sm);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.cr-pane .lab{position:absolute;left:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:2;background:var(--surface);padding:2px 8px;border-radius:999px}
.cr-stage{position:relative;cursor:crosshair;touch-action:none}
.cr-stage img{display:block;max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none}
.cr-rect{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:2px solid #fff;pointer-events:none;border-radius:3px}
.cr-fp{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none}
.cr-prev{max-width:calc(100% - 20px);max-height:calc(100% - 44px);margin-top:20px;box-shadow:var(--shadow);border-radius:4px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/14px 14px}
.cr-foot{display:flex;gap:10px;align-items:center}
.cr-thumbs{display:flex;gap:6px;overflow:auto;flex:1;padding:2px}
.cr-thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;border:2.5px solid transparent;position:relative;cursor:pointer;background:var(--surface-2);padding:0}
.cr-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cr-thumb.on{border-color:var(--accent)}
.cr-thumb .rm{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:10px;line-height:16px;padding:0;display:none}
.cr-thumb:hover .rm{display:block}
.cr-add{width:52px;height:52px;border-radius:10px;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.cr-info{font-size:11.5px;color:var(--muted)}
.cr-warn{color:var(--mid);font-weight:700}

/* placeholder */
.missing{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:6px;color:var(--muted);padding:14px;font-size:12.5px}

/* steps editor */
.step{display:grid;grid-template-columns:120px 1fr auto;gap:6px;align-items:start;padding:8px;background:var(--surface-2);border-radius:var(--r-xs);margin-bottom:6px}
.step .sf{display:flex;flex-direction:column;gap:6px}
.step .sa{display:flex;gap:2px}
.tree{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-xs);padding:8px}
.tree .pg{font-weight:700;margin:6px 0 4px}
.tree label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.tree .sub{padding-left:24px}

.welcome-mark{width:64px;height:64px;color:var(--accent);margin-bottom:6px}
kbd{font:600 11px var(--font);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

.t-nav .shield{display:none}

.t-nav .card.flat{display:flex;flex-direction:row;align-items:center}
.t-nav .card.flat:has(.nav.v){align-items:stretch}
.nav:not(.v){width:fit-content;max-width:100%;height:min(100%,58px)}
.nav.v{height:100%;width:100%}
/* vakken: greep en knoppen op de rand, zodat ze niet onder de widgets erin vallen */
.t-box .grip{left:28px;transform:none;top:-11px}
.t-box .tools{top:-15px;right:24px}
/* widgets zonder kop: gelijke ruimte boven en onder */
.card>.card-body:first-child{padding-top:16px;padding-bottom:16px}
/* radio past zich aan als het vak laag is (bijv. in een vak met eigen raster) */
.t-radio .card-body{container-type:size}
.radio-play{width:auto;height:min(56px,100%);aspect-ratio:1}
@container (max-height:100px){.radio-ctrl{display:none}}

/* ---------- knoppen (v1.0.4): naam op 5 plekken, tekst valt nooit weg ---------- */
.lb{position:relative;--lbbg:var(--surface);gap:10px}
.lb.accent{--lbbg:var(--accent)}.lb.dark{--lbbg:var(--ink)}.lb.outline{--lbbg:var(--bg)}
.lb.pos-bottom{flex-direction:column}
.lb.pos-top{flex-direction:column-reverse}
.lb.pos-right{flex-direction:row;text-align:left}
.lb.pos-left{flex-direction:row-reverse;text-align:right}
.lb.pos-center{flex-direction:column}
.lb .lbi{position:relative}
.lb .lbi .ic{width:var(--ics,22px);height:var(--ics,22px)}
.lb .lbi img{width:var(--ics,26px);height:var(--ics,26px)}
.lb .lbx{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%;flex:0 1 auto}
.lb .lbt{font-size:var(--btn-fs,14px);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:unset;overflow:hidden;overflow-wrap:break-word;hyphens:auto}
.lb .lbs{font-size:calc(var(--btn-fs,14px) * .82);display:block}
.lb.pos-center .lbx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 2 * var(--pad,10px));align-items:center;z-index:1}
.lb.pos-center .lbi,.lb.tight .lbi{opacity:.4}
.lb.pos-center .lbt,.lb.tight .lbt,.lb.tight .lbs{text-shadow:0 0 3px var(--lbbg),0 0 8px var(--lbbg),0 0 12px var(--lbbg)}
.lb.tight .lbi{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.lb.tight .lbx{position:absolute;z-index:1}
.lb.tight.pos-bottom .lbx{left:var(--pad);right:var(--pad);bottom:var(--pad);align-items:center}
.lb.tight.pos-top .lbx{left:var(--pad);right:var(--pad);top:var(--pad);align-items:center}
.lb.tight.pos-right .lbx{right:var(--pad);top:50%;transform:translateY(-50%);max-width:calc(100% - 2 * var(--pad));text-align:right}
.lb.tight.pos-left .lbx{left:var(--pad);top:50%;transform:translateY(-50%);max-width:calc(100% - 2 * var(--pad));text-align:left}

/* ---------- update-voortgang ---------- */
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.upd-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px}
.upd-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.upd-step{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--muted);font-size:13.5px}
.upd-step .st{width:18px;display:grid;place-items:center}
.upd-step.run{color:var(--ink);font-weight:650}
.upd-step.ok{color:var(--ink)}.upd-step.ok .st{color:var(--accent)}
.upd-step.err{color:var(--hi);font-weight:650}
.upd-msg{margin-top:12px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.upd-msg:empty{display:none}
.upd-msg>.ic{color:var(--accent);flex:none;margin-top:1px}
.pill.busy{animation:none;opacity:.85;pointer-events:none}

/* ---------- kniptool: snelkoppelingen en versies ---------- */
.cr-fmt{max-width:100%}
.cr-fmt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-chips,.cr-vers{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.cr-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.cr-chip:hover:not(:disabled){border-color:var(--accent)}
.cr-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cr-chip:disabled{opacity:.45;cursor:default}
.cr-chip.add{border-style:dashed;color:var(--muted);padding:5px 9px}
.cr-ver{display:inline-flex;align-items:center;border-radius:999px;background:var(--surface-2);border:1px solid transparent}
.cr-ver.on{background:var(--ink);color:var(--bg)}
.cr-ver-b{border:0;background:transparent;color:inherit;font-size:12px;font-weight:650;padding:5px 10px;font-variant-numeric:tabular-nums}
.cr-ver-x{border:0;background:transparent;color:inherit;opacity:.6;padding:0 8px 0 0;display:grid;place-items:center}
.cr-ver-x:hover{opacity:1}
.cr-count{position:absolute;left:3px;bottom:3px;min-width:17px;height:17px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.cr-star.on,.cr-star-ic.on{color:var(--mid)}
.cr-star.on .ic,.cr-star-ic.on .ic{fill:currentColor}
.cr-star-ic{color:var(--line);display:grid;place-items:center}
.pop .opt.cr-cur{background:var(--accent-soft);font-weight:650}
.pop .opt .grow{flex:1}
.cr-pane .lab{max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0}

/* ---------- team ---------- */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;overflow:hidden;flex:none;line-height:1;box-shadow:0 0 0 2px var(--surface)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.mini.av-btn{width:30px;height:30px;padding:0}
.iconbtn .av{box-shadow:none}
.pop .opt .av{box-shadow:none}
.tt.clickable{cursor:pointer}
.tt.clickable:hover{text-decoration:underline;text-underline-offset:3px}
.todo .meta.warn{color:var(--mid)}
.lockb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.teamb{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:none;margin-right:2px}
.todo.team{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface-2))}
.todo .drag{width:12px;margin-left:2px;margin-right:-6px;color:var(--muted);opacity:0;cursor:grab;flex:none;display:grid;place-items:center}
.todo .drag .ic{width:12px;height:14px}
.todo:hover .drag{opacity:.7}
.todo.dragged{opacity:.4}
.todo.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.todo.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.todo-foot .sync{display:inline-flex;gap:4px;align-items:center;color:var(--accent);font-weight:650}
.members{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;margin:0 -6px;padding:2px 6px}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);border:0;text-align:left;width:100%;color:var(--ink)}
button.member:hover{background:var(--accent-soft)}
.member b{display:block;font-size:13.5px}
.member small{display:block;color:var(--muted);font-size:11.5px}
.mailbox{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.mailbody{white-space:pre-wrap;font:13px/1.5 var(--font);margin:8px 0 0;max-height:280px;overflow:auto;padding-top:8px;border-top:1px solid var(--line)}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.swatch-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.btn:disabled,.seg button:disabled{opacity:.55;cursor:default}

</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandmark"></div>
    <span class="brand-name">Streamline</span>
    <span class="brand-sub" id="brandsub"></span>
  </div>
  <div class="top-actions">
    <span class="save-dot" id="savedot" title="Opslaan…"></span>
    <button class="pill edit-only" id="btn-repo">Widgets</button>
    <button class="pill edit-only" id="btn-settings">Instellingen</button>
    <button class="pill accent edit-only" id="btn-done">Klaar</button>
    <button class="pill update" id="updatebtn" style="display:none" title="Er is een update beschikbaar">Update</button>
    <button class="round" id="gear" title="Dashboard aanpassen" aria-label="Dashboard aanpassen"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<div id="banner"></div>
<main id="canvas"></main>

<section class="panel" id="panel-repo" data-name="repo" aria-label="Widgets">
  <div class="panel-grip" title="Sleep om te verplaatsen"><span></span></div>
  <div class="panel-head"><h3>Widgets</h3><button class="iconbtn x" title="Sluiten"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="panel-body" id="repo-body"></div>
</section>
<section class="panel" id="panel-settings" data-name="settings" aria-label="Instellingen" style="width:430px">
  <div class="panel-grip" title="Sleep om te verplaatsen"><span></span></div>
  <div class="panel-head"><h3>Instellingen</h3><button class="iconbtn x" title="Sluiten"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="tabs" id="settings-tabs"></div>
  <div class="panel-body" id="settings-body"></div>
</section>
<div id="toasts" aria-live="polite"></div>

<script>
/* Streamline — icon catalogus (eigen lijn-iconen, 24×24, geen externe bronnen) */
const ICONS = {
  home:['huis start thuis','<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>'],
  search:['zoeken vergrootglas','<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'],
  settings:['instellingen tandwiel','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'],
  lock:['slot op slot vergrendel','<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>'],
  unlock:['slot open ontgrendel','<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/>'],
  copy:['kopieer dupliceer','<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'],
  trash:['verwijder prullenbak weg','<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/>'],
  plus:['toevoegen nieuw plus','<path d="M12 5v14M5 12h14"/>'],
  x:['sluiten kruis','<path d="M6 6l12 12M18 6 6 18"/>'],
  check:['vinkje klaar gedaan','<path d="m5 12.5 4.5 4.5L19 7.5"/>'],
  pencil:['bewerk potlood schrijven','<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'],
  link:['link koppeling url','<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>'],
  external:['extern nieuw tabblad openen','<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'],
  globe:['wereld website internet web','<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.6 3.6 5.4 3.6 8.5s-1.1 5.9-3.6 8.5c-2.5-2.6-3.6-5.4-3.6-8.5S9.5 6.1 12 3.5z"/>'],
  mail:['mail email post','<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/>'],
  inbox:['inbox postvak','<path d="M3 13h5l1.5 2.5h5L16 13h5"/><path d="M5.5 5.5h13L21 13v4.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V13z"/>'],
  send:['verstuur verzenden','<path d="M21 3 10 14"/><path d="m21 3-7 18-4-7-7-4z"/>'],

    const f = frameFor(it, items, memo), r = rectIn(it, f);
    if (it.type === 'box') {

      if (isInsideBox(it)) {

function initDrag() {
  const cv = canvas();
  cv.addEventListener('click', e => {
    const b = e.target.closest('.tools button'); if (!b || !editing) return;
    const id = b.closest('.item').dataset.id; const { item } = findItem(id); if (!item) return;
    const act = b.dataset.act;
    if (act === 'lock') { pushHistory(); item.locked = !item.locked; buildItem(item); save(); toast(item.locked ? 'Op slot gezet' : 'Ontgrendeld'); }
    if (act === 'config') openItemConfig(item);
    if (act === 'copy') duplicateItem(item);
    if (act === 'delete') deleteItem(item);
  });
  cv.addEventListener('pointerdown', e => {
    if (!editing || e.button !== 0) return;
    const itemEl = e.target.closest('.item'); if (!itemEl || e.target.closest('.tools')) return;
    const resize = !!e.target.closest('.resize');
    if (!resize && !e.target.closest('.shield,.grip')) return;
    const { item } = findItem(itemEl.dataset.id); if (!item) return;
    if (item.locked) { toast('Dit onderdeel staat op slot — klik op het slotje om het te ontgrendelen'); return; }
    e.preventDefault();
    pushHistory();
    const sx = e.clientX, sy = e.clientY, o = { x: item.x, y: item.y, w: item.w, h: item.h };
    const f0 = frameFor(item, [...S.global, ...currentPage().items]);
    const kids = (!resize && item.type === 'box') ? findItem(item.id).list.filter(i => inside(i, item)).map(i => ({ i, x: i.x, y: i.y })) : [];
    const def = WIDGETS[item.type] || {}; const min = def.min || { w: 1, h: 1 }; const max = def.max || { w: S.grid.cols, h: 60 };
    const badge = itemEl.querySelector('.size-badge');
    itemEl.classList.add(resize ? 'resizing' : 'dragging');
    itemEl.setPointerCapture(e.pointerId);
    let moved = false;
    const move = ev => {
      const dx = (ev.clientX - sx) / (f0.cw + f0.gap), dy = (ev.clientY - sy) / (f0.rh + f0.gap);
      if (resize) {
        item.w = clamp(Math.round(o.w + dx), min.w, Math.min(max.w, S.grid.cols - item.x));
        item.h = clamp(Math.round(o.h + dy), min.h, max.h);
        badge.textContent = `${item.w} × ${item.h}`;
      } else {
        item.x = clamp(Math.round(o.x + dx), 0, S.grid.cols - item.w);
        item.y = Math.max(0, Math.round(o.y + dy));
        for (const k of kids) { k.i.x = k.x + item.x - o.x; k.i.y = k.y + item.y - o.y; }
        badge.textContent = `kolom ${item.x + 1} · rij ${item.y + 1}`;
      }
      moved = true; layout();
    };
    const up = () => {
      itemEl.classList.remove('resizing', 'dragging');
      itemEl.removeEventListener('pointermove', move); itemEl.removeEventListener('pointerup', up); itemEl.removeEventListener('pointercancel', up);
      if (moved) { save(); if (resize && WIDGETS[item.type]?.rebuildOnResize) buildItem(item); } else hist.pop();
      layout();
    };
    itemEl.addEventListener('pointermove', move); itemEl.addEventListener('pointerup', up); itemEl.addEventListener('pointercancel', up);
  });
  cv.addEventListener('dblclick', e => {
    if (!editing) return; const itemEl = e.target.closest('.item'); if (!itemEl) return;
    const { item } = findItem(itemEl.dataset.id); if (item && !item.locked) openItemConfig(item);
  });
}
function overlaps(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }

  const others = [...S.global, ...currentPage().items].filter(i => !(ignoreBoxes && i.type === 'box'));
  for (let y = 0; y < 400; y++) for (let x = 0; x <= S.grid.cols - w; x++) {

}
function pageBottom(items = [...S.global, ...currentPage().items]) { return items.reduce((m, i) => Math.max(m, i.y + i.h), 0); }

  const def = WIDGETS[type]; if (!def) return;

  const spot = freeSpot(size.w, size.h, type !== 'box');
  const it = mk(type, spot.x, spot.y, size.w, size.h, cfg);
  (def.global ? S.global : currentPage().items).push(it);
  mountItem(it); layout(); save();
  const el = els.get(it.id); el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.animate([{ transform: 'scale(.94)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, easing: 'ease-out' });

/* ---------- configuratie per onderdeel ---------- */
function fieldEl(f, cfg, onChange) {
  const set = v => { cfg[f.key] = v; onChange && onChange(f.key, v); };
  const wrap = h('div', { class: 'field' });
  if (f.type !== 'checkbox') wrap.append(h('label', {}, f.label));
  let ctl;
  switch (f.type) {
    case 'textarea': ctl = h('textarea', { class: 'inp', value: cfg[f.key] ?? '', placeholder: f.placeholder || '', oninput: e => set(e.target.value) }); break;
    case 'number': ctl = h('input', { class: 'inp', type: 'number', min: f.min, max: f.max, step: f.step || 1, value: cfg[f.key] ?? '', oninput: e => set(Number(e.target.value)) }); break;
    case 'select': ctl = h('select', { class: 'inp', value: String(cfg[f.key] ?? ''), onchange: e => set(isNaN(e.target.value) || e.target.value === '' ? e.target.value : Number(e.target.value)) }, f.options.map(([v, l]) => h('option', { value: String(v) }, l))); break;
    case 'seg': {
      ctl = h('div', { class: 'seg' });
      const draw = () => { ctl.innerHTML = ''; for (const [v, l] of f.options) ctl.append(h('button', { type: 'button', class: cfg[f.key] === v ? 'on' : '', onclick: () => { set(v); draw(); } }, l)); };
      draw(); break;
    }
    case 'checkbox': ctl = h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!cfg[f.key], onchange: e => set(e.target.checked) }), f.label); break;
    case 'range': {
      const out = h('span', { class: 'badge' }, (cfg[f.key] ?? 0) + (f.unit || ''));
      ctl = h('div', { class: 'row' }, h('input', { type: 'range', min: f.min, max: f.max, step: f.step || 1, value: cfg[f.key] ?? 0, oninput: e => { set(Number(e.target.value)); out.textContent = e.target.value + (f.unit || ''); } }), out);
      break;

      const inp = h('input', { type: 'color', value: cfg[f.key] || f.fallback || '#888888', oninput: e => { set(e.target.value); lab.textContent = e.target.value; } });
      const lab = h('span', { class: 'hint', style: { margin: 0 } }, cfg[f.key] || 'themakleur');
      ctl = h('div', { class: 'row' }, inp, lab, f.allowTheme ? h('button', { class: 'btn sm', type: 'button', onclick: () => { set(''); lab.textContent = 'themakleur'; } }, 'Thema') : null);
      break;

    case 'icon': {
      const btn = h('button', { class: 'btn', type: 'button' });
      const draw = () => { btn.innerHTML = icon(cfg[f.key] || 'globe', 18) + ' Kies icoon'; };

  popover(anchor, [
    h('div', { class: 'lbl', style: { padding: '4px 10px 6px' } }, 'Herinner mij…'),
    [['Over 15 minuten', 15], ['Over 30 minuten', 30], ['Over 1 uur', 60], ['Over 3 uur', 180]].map(([l, m]) => h('button', { class: 'opt', html: icon('clock', 15) + l, onclick: at(m * 6e4) })),
    h('button', { class: 'opt', html: icon('sun', 15) + 'Morgen om 09:00', onclick: () => { closePop(); askNotify(); cb(tomorrow9()); } }),
    h('hr'),
    h('div', { style: { padding: '0 6px 6px' } }, dt, h('button', { class: 'btn primary sm', style: { marginTop: '6px', width: '100%' }, onclick: () => { const t = new Date(dt.value).getTime(); if (t) { closePop(); askNotify(); cb(t); } } }, 'Instellen')),
    current ? h('button', { class: 'opt', html: icon('x', 15) + 'Herinnering verwijderen', onclick: () => { closePop(); cb(null); } }) : null,
  ]);
}
function askNotify() { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }

  return same ? t : d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) + ' ' + t;
}

    const c = audioCtx, t0 = c.currentTime;

      const o = c.createOscillator(), g = c.createGain();

      g.gain.setValueAtTime(0, t0 + off); g.gain.linearRampToValueAtTime(.25, t0 + off + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + off + .19);
      o.connect(g).connect(c.destination); o.start(t0 + off); o.stop(t0 + off + .2);
    });
  } catch (e) {}
}

function checkReminders() {

/* ---------- updates & uitbreidingen via GitHub (alleen ophalen, nooit versturen) ---------- */
const remote = { version: null, info: null, registry: null };
const rawUrl = path => `https://raw.githubusercontent.com/${S.update.repo.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '')}/${S.update.branch || 'main'}/${path}`;
const verParts = v => String(v || '0').split('.').map(n => parseInt(n) || 0);
function cmpVer(a, b) { const x = verParts(a), y = verParts(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; }
async function checkUpdate(manual) {
  if (!S.update.repo) { if (manual) toast('Vul eerst je GitHub-repository in'); return; }
  try {
    const r = await fetch(rawUrl('version.json') + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const v = await r.json(); remote.info = v; remote.version = v.version;
    const newer = cmpVer(v.version, APP_VERSION) > 0;
    const big = verParts(v.version)[0] > verParts(APP_VERSION)[0] || v.groot === true;
    const show = newer && (S.update.notify === 'all' || (S.update.notify === 'major' && big));
    $('#updatebtn').style.display = show ? 'inline-flex' : 'none';
    if (manual) toast(newer ? `Versie ${v.version} is beschikbaar${big ? ' (grote update)' : ''}` : 'Je hebt de nieuwste versie');
    if (manual && newer) $('#updatebtn').style.display = 'inline-flex';
  } catch (e) { if (manual) toast('GitHub niet bereikbaar: ' + e.message, 4000); }
}
async function installUpdate() {

    h('p', { class: 'hint' }, canWrite

      : `Je map is niet gekoppeld, dus ik kan het bestand niet zelf vervangen. Ik download de nieuwe versie; zet die op de plek van je huidige “${name}” en open hem opnieuw.`));
  const bar = h('div', { class: 'upd-bar' }, h('i'));

      go.disabled = later.disabled = false; go.textContent = 'Opnieuw proberen'; later.textContent = 'Sluiten';

}
async function loadPlugins() {
  const store = (await IDB.get('plugins')) || {};
  for (const p of Object.values(store)) await injectPlugin(p.code).catch(e => console.warn('plugin', p.id, e));
}
function injectPlugin(code) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    const s = h('script', { src: url }); s.onload = () => { URL.revokeObjectURL(url); res(); }; s.onerror = rej;
    document.head.append(s);
  });
}
async function fetchRegistry() {
  const r = await fetch(rawUrl('widgets/registry.json') + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  remote.registry = await r.json(); return remote.registry;
}
async function installPlugin(entry) {
  const r = await fetch(rawUrl(entry.file) + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const code = await r.text();
  const store = (await IDB.get('plugins')) || {};
  store[entry.id] = { ...entry, code, installed: Date.now() };
  await IDB.set('plugins', store);
  if (FS.dir && FS.perm) await writeText('widgets/' + entry.id + '.js', code).catch(() => {});
  if (!S.plugins.find(p => p.id === entry.id)) S.plugins.push({ id: entry.id, name: entry.name, version: entry.version });
  else Object.assign(S.plugins.find(p => p.id === entry.id), { version: entry.version });

  await injectPlugin(code);
}

  S.plugins = S.plugins.filter(p => p.id !== id); save();
  toast('Verwijderd — ververs de pagina om hem helemaal te ontladen');
}

async function openFromDir(cached) {
  const files = await listFiles();
  let name = await IDB.get('lastFile');
  if (!files.includes(name)) name = files[0];
  if (!name) {
    S = cached ? migrate(cached.state) : defaultState('Mijn dashboard');
    FS.file = await freeFileName(S.meta.title);
    await writeJSON(FS.file, S);
  } else {
    let st = migrate(await readJSON(name));
    if (cached && cached.file === name && (cached.state?.meta?.updated || 0) > (st.meta.updated || 0)) st = migrate(cached.state);
    S = st; FS.file = name;
  }

  await IDB.set('lastFile', FS.file);

}

async function titlesFromDrop(dt) {
  const out = [];
  for (const f of [...(dt.files || [])]) {
    const n = f.name || '';
    if (/\.(eml|msg)$/i.test(n)) {
      try { const m = await MailParser.parseFile(f); out.push(m.subject || n.replace(/\.(eml|msg)$/i, '')); continue; } catch (e) {}
    }
    out.push(n.replace(/\.(msg|eml|txt|url|html?)$/i, ''));
  }
  if (!out.length) {
    const t = dt.getData('text/plain') || dt.getData('text/uri-list') || '';
    const line = t.split(/\r?\n/).map(s => s.trim()).find(Boolean);
    if (line) out.push(line);
  }

}

    for (const c of [...node.childNodes]) {

        walk(c);
        if (!ALLOWED.has(c.tagName)) { c.replaceWith(...c.childNodes); continue; }
        for (const a of [...c.attributes]) if (!(c.tagName === 'A' && a.name === 'href') && !(a.name === 'class' && /^(chk|ok)$/.test(a.value))) c.removeAttribute(a.name);

      } else if (c.nodeType !== 3) c.remove();
    }
  };
  walk(doc.body); return doc.body.innerHTML;
}

        st.imgs.length > 1 ? h('button', { class: 'opt', html: icon('layers', 15) + `Alles: ${st.imgs.length} afbeeldingen, ${total} bestanden (zip)`, onclick: () => { closePop(); exportSet(st.imgs.flatMap(x => x.vers.map(y => [x, y]))); } }) : '',

});

/* ==========================================================================

   Alles gebeurt lokaal in de browser.

  /* ---------- .eml (MIME) ---------- */
  const latin1 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return s; };

/* ==========================================================================
   Streamline — Team (samenwerken via een gedeelde map, bijv. op OneDrive)

   Opbouw van de teammap:
     team.json              teamnaam, versleutelde sleutel (alleen te openen met het wachtwoord)
     leden/<id>.json        per teamlid één bestand; ieder schrijft ALLEEN in zijn eigen bestand,
                            zodat OneDrive nooit twee mensen in hetzelfde bestand laat schrijven
     bijlagen/<id>.bin      versleutelde bijlagen van gedeelde e-mails

   Alle inhoud (taken, mails, bijlagen, namen, foto's) is versleuteld met AES-256 (AES-GCM).
   De sleutel wordt beschermd door het teamwachtwoord (PBKDF2). In je persoonlijke instellingen
   staat de sleutel nog eens versleuteld met een apparaatsleutel die alleen in déze browser bestaat:
   deel je je persoonlijke preset, dan deel je dus géén toegang tot het team.

   Samenvoegen: elk veld van een taak heeft een tijdstempel; de nieuwste wint. Wijzigen twee
   mensen hetzelfde veld zonder elkaars wijziging te hebben gezien, dan krijgt de taak een
   waarschuwing. Tijdens het bewerken van een taak 'vergrendelt' Streamline die voor anderen.
   ========================================================================== */
const TEAM_ITER = 250000;
const LOCK_MS = 90000;
const SYNC_MS = 3000;
const B64 = {
  enc(u8) { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); },
  dec(b) { return Uint8Array.from(atob(b), c => c.charCodeAt(0)); },
};
const TC = {
  rand: n => crypto.getRandomValues(new Uint8Array(n)),
  async kek(password, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  importRaw: raw => crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']),
  async newKey() { const raw = TC.rand(32); return { raw, key: await TC.importRaw(raw) }; },
  async enc(key, bytes) { const iv = TC.rand(12); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)); const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out; },
  async dec(key, bytes) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12))); },
  async encStr(key, str) { return B64.enc(await TC.enc(key, new TextEncoder().encode(str))); },
  async decStr(key, b64) { return new TextDecoder().decode(await TC.dec(key, B64.dec(b64))); },
  async deviceKey() {
    let k = await IDB.get('devkey');
    if (!k) { k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); await IDB.set('devkey', k); }
    return k;
  },
};

const Team = {
  dir: null, perm: false, meta: null, metaStamp: 0,
  key: null, kid: null, keys: {},           // kid -> CryptoKey (huidige + oudere sleutels)
  status: 'off',                            // off | perm | locked | ok | error
  error: '',
  mine: null,                               // { profile, records, locks, updated }
  others: new Map(),                        // bestandsnaam -> { stamp, data }
  tasks: [], members: new Map(), locks: new Map(),
  timer: null, writeTimer: null, firstMerge: true, lastWriteError: 0,
};
const TEAM_PROFILE_COLORS = ['#2E5E4E', '#A4532C', '#3D5A80', '#7A4E8C', '#B5651D', '#2F6F73', '#8C3B4E', '#5C6B2E'];
const teamOn = () => !!(S && S.team);
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' kB';
const meId = () => S?.team?.memberId;

/* ---------- bestanden in de teammap ---------- */
async function tGet(path, create) {
  const parts = path.split('/'); let d = Team.dir;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, { create });
  return d.getFileHandle(parts.at(-1), { create });
}
async function tReadText(path) { return (await (await tGet(path)).getFile()).text(); }
async function tWrite(path, data) { const w = await (await tGet(path, true)).createWritable(); await w.write(data); await w.close(); }
async function tStamp(path) { try { return (await (await tGet(path)).getFile()).lastModified; } catch (e) { return 0; } }
async function teamEnsurePerm() {
  if (!Team.dir) return false;
  let st = 'prompt';
  try { st = await Team.dir.queryPermission({ mode: 'readwrite' }); } catch (e) {}
  if (st !== 'granted' && navigator.userActivation?.isActive) { try { st = await Team.dir.requestPermission({ mode: 'readwrite' }); } catch (e) {} }
  Team.perm = st === 'granted';
  return Team.perm;
}

/* ---------- sleutels ---------- */
async function teamKeyFromAccess() {
  const acc = S.team?.access; if (!acc?.blob) return null;
  try { const raw = await TC.dec(await TC.deviceKey(), B64.dec(acc.blob)); return { kid: acc.kid, raw, key: await TC.importRaw(raw) }; } catch (e) { return null; }
}
async function storeAccess(kid, raw) {
  S.team.access = { kid, blob: B64.enc(await TC.enc(await TC.deviceKey(), raw)) };
  save();
}
async function loadKeyring(cur) {
  Team.keys = { [cur.kid]: cur.key }; Team.key = cur.key; Team.kid = cur.kid;
  for (const r of Team.meta.ring || []) {
    try { Team.keys[r.kid] = await TC.importRaw(await TC.dec(cur.key, B64.dec(r.key))); } catch (e) {}
  }
}
async function unlockWithPassword(meta, password) {
  const kek = await TC.kek(password, B64.dec(meta.kdf.salt), meta.kdf.iter);
  let raw; try { raw = await TC.dec(kek, B64.dec(meta.wrapped)); } catch (e) { return null; }
  return { kid: meta.kid, raw, key: await TC.importRaw(raw) };
}

/* ---------- eigen bestand ---------- */
const myFile = () => `leden/${meId()}.json`;
function scheduleTeamWrite() { clearTimeout(Team.writeTimer); Team.writeTimer = setTimeout(writeMine, 250); }
async function writeMine() {
  clearTimeout(Team.writeTimer);
  if (Team.status !== 'ok' || !Team.mine) return;
  if (!(await teamEnsurePerm())) { setTeamStatus('perm'); return; }
  Team.mine.updated = Date.now();
  try {
    const data = await TC.encStr(Team.key, JSON.stringify(Team.mine));
    await tWrite(myFile(), JSON.stringify({ app: 'streamline-member', v: 1, member: meId(), kid: Team.kid, data }));
    const own = Team.others.get(myFile().split('/')[1]); if (own) own.stamp = await tStamp(myFile());
  } catch (e) {
    if (e.name === 'NotAllowedError') setTeamStatus('perm');
    else if (Date.now() - Team.lastWriteError > 20000) { Team.lastWriteError = Date.now(); toast('Opslaan in de teammap mislukt: ' + e.message, 5000); }
  }
}

/* ---------- samenvoegen ---------- */
const newer = (a, b) => !b || a.t > b.t || (a.t === b.t && String(a.by) > String(b.by));
function mergeAll() {
  const sources = [Team.mine, ...[...Team.others.entries()].filter(([n]) => n !== meId() + '.json').map(([, o]) => o.data)].filter(Boolean);
  const fields = new Map(), all = new Map();
  Team.members = new Map(); Team.locks = new Map();
  for (const src of sources) {
    const by = src.member || meId();
    if (src.profile) { const m = Team.members.get(src.profile.id); if (!m || (src.updated || 0) > (m.updated || 0)) Team.members.set(src.profile.id, { ...src.profile, updated: src.updated || 0 }); }
    for (const [tid, until] of Object.entries(src.locks || {})) if (until > Date.now() && src.profile?.id !== meId()) Team.locks.set(tid, { by: src.profile?.id, until });
    for (const [id, rec] of Object.entries(src.records || {})) {
      if (!fields.has(id)) { fields.set(id, {}); all.set(id, {}); }
      const best = fields.get(id), vers = all.get(id);
      for (const [k, fv] of Object.entries(rec.f || {})) {
        (vers[k] ||= []).push(fv);
        if (newer(fv, best[k])) best[k] = fv;
      }
    }
  }
  const tasks = [];
  for (const [id, best] of fields) {
    const t = { id, _f: best, conflicts: [] };
    for (const [k, fv] of Object.entries(best)) t[k] = fv.v;
    // gelijktijdige wijzigingen zonder dat de winnaar de ander had gezien
    for (const [k, list] of Object.entries(all.get(id))) {
      const w = best[k];

/* ---------- synchroniseren ---------- */
async function teamSync() {
  if (!teamOn() || !Team.dir) return;
  if (!(await teamEnsurePerm())) return setTeamStatus('perm');
  try {
    const stamp = await tStamp('team.json');
    if (stamp && stamp !== Team.metaStamp) {
      Team.meta = JSON.parse(await tReadText('team.json')); Team.metaStamp = stamp;
      if (Team.meta.kid !== Team.kid) { // wachtwoord gewijzigd
        const acc = await teamKeyFromAccess();
        if (!acc || acc.kid !== Team.meta.kid) { Team.key = null; return setTeamStatus('locked'); }
        await loadKeyring(acc);
      }
    }
    if (Team.status !== 'ok') return;
    let changed = false;
    const ledenDir = await Team.dir.getDirectoryHandle('leden', { create: true });
    const seen = new Set();
    for await (const [name, hd] of ledenDir.entries()) {
      if (hd.kind !== 'file' || !name.endsWith('.json')) continue;
      seen.add(name);
      const f = await hd.getFile(); const prev = Team.others.get(name);
      if (prev && prev.stamp === f.lastModified) continue;
      try {
        const wrap = JSON.parse(await f.text()); const key = Team.keys[wrap.kid];
        const data = key ? JSON.parse(await TC.decStr(key, wrap.data)) : null;
        if (data) { data.member = wrap.member; Team.others.set(name, { stamp: f.lastModified, data }); changed = true; }
        else Team.others.set(name, { stamp: f.lastModified, data: prev?.data || null });
      } catch (e) { Team.others.set(name, { stamp: f.lastModified, data: prev?.data || null }); }
    }
    for (const n of [...Team.others.keys()]) if (!seen.has(n)) { Team.others.delete(n); changed = true; }
    // vergrendelingen verlopen vanzelf
    const expired = [...Team.locks.values()].some(l => l.until <= Date.now());
    if (changed || expired) { mergeAll(); teamRefresh(); }
  } catch (e) {
    if (e.name === 'NotAllowedError') setTeamStatus('perm');
    else console.warn('teamSync', e);
  }
}
function setTeamStatus(st, err) {
  const changed = Team.status !== st; Team.status = st; Team.error = err || '';
  if (changed) { teamRefresh(); if (typeof renderSettings === 'function') renderSettings(); }
}
async function teamStart() {
  clearInterval(Team.timer);
  Object.assign(Team, { dir: null, perm: false, meta: null, metaStamp: 0, key: null, kid: null, keys: {}, mine: null, others: new Map(), tasks: [], members: new Map(), locks: new Map(), firstMerge: true });
  if (!teamOn()) { Team.status = 'off'; return; }
  Team.dir = (await IDB.get('teamdir:' + S.team.id)) || null;
  if (!Team.dir) { setTeamStatus('perm', 'nodir'); return; }
  await teamOpen();
  Team.timer = setInterval(teamSync, SYNC_MS);
}
async function teamOpen() {
  if (!(await teamEnsurePerm())) return setTeamStatus('perm');
  try {
    Team.meta = JSON.parse(await tReadText('team.json')); Team.metaStamp = await tStamp('team.json');
    if (Team.meta.id !== S.team.id) return setTeamStatus('error', 'Deze map hoort bij een ander team.');
    const acc = await teamKeyFromAccess();
    if (!acc || acc.kid !== Team.meta.kid) return setTeamStatus('locked');
    await loadKeyring(acc);
    // eigen bestand terugzetten (staat in de teammap)
    let mine = null, mineKid = null;

    const col = TEAM_PROFILE_COLORS[[...meId()].reduce((n, c) => n + c.charCodeAt(0), 0) % TEAM_PROFILE_COLORS.length];
    Team.mine = mine || { profile: { id: meId(), name: S.team.myName || 'Ik', avatar: '', color: col }, records: {}, locks: {}, updated: 0 };

/* ---------- melding bij een nieuwe taak ---------- */
function checkAssigned() {

  const seen = new Set(S.team.seen || []);
  const mine = Team.tasks.filter(t => t.assignee === meId() && !t.done);
  const fresh = mine.filter(t => !seen.has(t.id));
  const first = S.team.seenInit !== true;
  if (first) { S.team.seenInit = true; save(); }
  if (!fresh.length) return;
  S.team.seen = [...new Set([...(S.team.seen || []).filter(id => Team.tasks.some(t => t.id === id)), ...fresh.map(t => t.id)])];
  save();

  for (const t of fresh) {

async function mailsFromDrop(dt) {
  const out = [];
  for (const f of [...(dt.files || [])]) {
    if (/\.(msg|eml)$/i.test(f.name)) {
      try { const m = await MailParser.parseFile(f); out.push({ title: m.subject || f.name.replace(/\.(msg|eml)$/i, ''), mail: m }); continue; } catch (e) { console.warn(e); }
    }
    out.push({ title: f.name.replace(/\.(msg|eml|txt|url|html?)$/i, '') });
  }
  if (!out.length) {
    const t = dt.getData('text/plain') || dt.getData('text/uri-list') || '';
    const line = t.split(/\r?\n/).map(s => s.trim()).find(Boolean);
    if (line) out.push({ title: line });
  }
  return out.map(o => ({ ...o, title: o.title.slice(0, 240) })).filter(o => o.title);
}

    h('p', { class: 'hint' }, 'De indeling van het team-tabblad is persoonlijk en staat in je eigen instellingenbestand. De taken zelf zijn voor het hele team.')));
}

boot();
</script>
</body>
</html>
